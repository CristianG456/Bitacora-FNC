server {
    listen 80;
    index index.php index.html;
    server_name localhost;

    root /var/www/public;

    # ── Security Headers ──────────────────────────────────────────
    # Previene Clickjacking: impide que el sitio sea embebido en iframes
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Previene MIME-sniffing attacks
    add_header X-Content-Type-Options "nosniff" always;
    # Controla la información de referrer filtrada a terceros
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Restringe acceso a APIs sensibles del navegador
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # X-XSS-Protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;
    # ─────────────────────────────────────────────────────────────

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Ocultar versión de Nginx y PHP
    server_tokens off;
}