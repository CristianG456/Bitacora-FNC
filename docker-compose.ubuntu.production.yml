services:

  db:
    image: mysql:8
    container_name: juridica_db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-laravel}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es obligatorio}"

    volumes:
      - /opt/juridica/mysql:/var/lib/mysql

    networks:
      - juridica_net

    healthcheck:
      test: [ "CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -u root --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  app:
    image: cristian123456/bitacora-fnc:v1.5.22
    container_name: juridica_app
    restart: unless-stopped
    working_dir: /var/www

    environment:
      APP_NAME: "Sistema Jurídico FNC"
      APP_ENV: production
      APP_KEY: "${APP_KEY:?APP_KEY es obligatorio}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:?APP_URL es obligatorio}"

      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      APP_FAKER_LOCALE: es_ES

      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: warning

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-laravel}"
      DB_USERNAME: root
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es obligatorio}"

      SESSION_DRIVER: file
      SESSION_LIFETIME: "120"
      SESSION_EXPIRE_ON_CLOSE: "true"
      SESSION_ENCRYPT: "true"
      SESSION_PATH: /
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax

      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      BROADCAST_CONNECTION: log

      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-juridica@example.invalid}"
      MAIL_FROM_NAME: "Sistema Jurídico"

      ADMIN_EMAIL: "${ADMIN_EMAIL:?ADMIN_EMAIL es obligatorio}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD es obligatorio}"

      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_REGION: "${R2_REGION:-auto}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      R2_PUBLIC_URL: "${R2_PUBLIC_URL:-}"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - /opt/juridica/storage:/var/www/storage

    networks:
      - juridica_net

    healthcheck:
      test: [ "CMD-SHELL", "php-fpm -t || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  scheduler:
    image: cristian123456/bitacora-fnc:v1.5.22
    container_name: juridica_scheduler
    restart: unless-stopped
    working_dir: /var/www

    entrypoint: []
    command: [ "php", "artisan", "schedule:work" ]

    environment:
      APP_NAME: "Sistema Jurídico FNC"
      APP_ENV: production
      APP_KEY: "${APP_KEY:?APP_KEY es obligatorio}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:?APP_URL es obligatorio}"

      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      APP_FAKER_LOCALE: es_ES

      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: warning

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-laravel}"
      DB_USERNAME: root
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es obligatorio}"

      SESSION_DRIVER: file
      SESSION_LIFETIME: "120"
      SESSION_EXPIRE_ON_CLOSE: "true"
      SESSION_ENCRYPT: "true"
      SESSION_PATH: /
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax

      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      BROADCAST_CONNECTION: log

      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-juridica@example.invalid}"
      MAIL_FROM_NAME: "Sistema Jurídico"

      ADMIN_EMAIL: "${ADMIN_EMAIL:?ADMIN_EMAIL es obligatorio}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD es obligatorio}"

      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_REGION: "${R2_REGION:-auto}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      R2_PUBLIC_URL: "${R2_PUBLIC_URL:-}"

    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

    volumes:
      - /opt/juridica/storage:/var/www/storage

    networks:
      - juridica_net

  webserver:
    image: cristian123456/bitacora-fnc:v1.5.22
    container_name: juridica_nginx
    restart: unless-stopped

    entrypoint: [ "/bin/sh", "-c" ]

    command:
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'

        map $$http_x_forwarded_host $$laravel_forwarded_host {
            default $$http_x_forwarded_host;
            "" $$http_host;
        }

        map $$http_x_forwarded_proto $$laravel_forwarded_proto {
            default $$http_x_forwarded_proto;
            "" https;
        }

        map $$http_x_forwarded_port $$laravel_forwarded_port {
            default $$http_x_forwarded_port;
            "" 443;
        }

        server {
            listen 80;
            server_name _;

            root /var/www/public;
            index index.php;

            charset utf-8;
            server_tokens off;
            client_max_body_size 100m;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

            location / {
                try_files $$uri $$uri/ /index.php?$$query_string;
            }

            location ^~ /storage/ {
                alias /var/www/storage/app/public/;
                access_log off;
                expires 7d;
            }

            location ^~ /build/assets/ {
                access_log off;
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }

            location ~* ^/(?:css|js)/.*\.(?:css|js)$$ {
                access_log off;
                expires 1h;
                add_header Cache-Control "public, max-age=3600";
            }

            location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|woff2?)$$ {
                access_log off;
                expires 7d;
                add_header Cache-Control "public, max-age=604800";
            }

            location ~ \.php$$ {
                try_files $$uri =404;

                include fastcgi_params;

                fastcgi_pass app:9000;
                fastcgi_index index.php;

                fastcgi_param SCRIPT_FILENAME $$document_root$$fastcgi_script_name;
                fastcgi_param DOCUMENT_ROOT $$document_root;

                fastcgi_param HTTP_PROXY "";

                fastcgi_param HTTP_HOST $$http_host;
                fastcgi_param HTTP_X_FORWARDED_HOST $$laravel_forwarded_host;
                fastcgi_param HTTP_X_FORWARDED_PROTO $$laravel_forwarded_proto;
                fastcgi_param HTTP_X_FORWARDED_PORT $$laravel_forwarded_port;

                fastcgi_param HTTPS on;
                fastcgi_param SERVER_PORT 443;

                fastcgi_read_timeout 300;
            }

            location ~ /\.(?!well-known).* {
                deny all;
            }
        }

        NGINX

        exec nginx -g 'daemon off;'

    depends_on:
      app:
        condition: service_healthy

    expose:
      - "80"

    volumes:
      - /opt/juridica/storage:/var/www/storage:ro

    networks:
      - juridica_net
      - proxy_net

    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://127.0.0.1/up > /dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:

  juridica_net:
    name: juridica_net
    driver: bridge

  proxy_net:
    external: true
    name: "${PROXY_NETWORK:-infra-net}"
