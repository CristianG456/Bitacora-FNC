services:

  db:
    image: mysql:8
    container_name: bitacora_db
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-laravel}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD obligatorio}"

    volumes:
      - bitacora_mysql:/var/lib/mysql

    healthcheck:
      test: [ "CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -u root --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    networks:
      - internal

  app:
    image: cristian123456/bitacora-fnc:v1.5.23
    container_name: bitacora_app
    restart: unless-stopped
    working_dir: /var/www

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - bitacora_storage:/var/www/storage

    healthcheck:
      test: [ "CMD-SHELL", "php-fpm -t || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    networks:
      - internal

  scheduler:
    image: cristian123456/bitacora-fnc:v1.5.23
    container_name: bitacora_scheduler
    restart: unless-stopped
    working_dir: /var/www

    entrypoint: []
    command: [ "php", "artisan", "schedule:work" ]

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

    volumes:
      - bitacora_storage:/var/www/storage

    networks:
      - internal

  webserver:
    image: cristian123456/bitacora-fnc:v1.5.23
    container_name: juridica_nginx
    restart: unless-stopped

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'

        # ========================================================
        # MODO DUAL
        #
        # Si existe un proxy inverso HTTPS delante, se respetan
        # X-Forwarded-Proto y X-Forwarded-Host.
        #
        # Si no existe proxy, se asume HTTP.
        # ========================================================

        map $$http_x_forwarded_proto $$laravel_forwarded_proto {
            default $$http_x_forwarded_proto;
            "" http;
        }

        map $$http_x_forwarded_host $$laravel_forwarded_host {
            default $$http_x_forwarded_host;
            "" $$http_host;
        }

        map $$http_x_forwarded_proto $$https_flag {
            https on;
            default off;
        }


        server {
            listen 80;
            server_name _;

            root /var/www/public;
            index index.php;

            charset utf-8;
            server_tokens off;
            client_max_body_size 100m;


            # ====================================================
            # CABECERAS DE SEGURIDAD
            # ====================================================

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;


            # ====================================================
            # LARAVEL
            # ====================================================

            location / {
                try_files $$uri $$uri/ /index.php?$$query_string;
            }


            # ====================================================
            # STORAGE
            # ====================================================

            location ^~ /storage/ {
                alias /var/www/storage/app/public/;
                access_log off;
                expires 7d;
            }


            # ====================================================
            # ASSETS VITE
            # ====================================================

            location ^~ /build/assets/ {
                access_log off;
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
                try_files $$uri =404;
            }


            # ====================================================
            # CSS, JS, IMÁGENES Y FUENTES
            # ====================================================

            location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
                access_log off;
                expires 7d;
                add_header Cache-Control "public, immutable";
            }


            # ====================================================
            # PHP-FPM / LARAVEL
            # ====================================================

            location ~ \.php$ {
                try_files $$uri =404;

                include fastcgi_params;

                fastcgi_pass app:9000;
                fastcgi_index index.php;

                fastcgi_param SCRIPT_FILENAME $$document_root$$fastcgi_script_name;
                fastcgi_param DOCUMENT_ROOT $$document_root;

                fastcgi_param HTTP_PROXY "";

                # Información original recibida desde
                # Nginx Proxy Manager / Cloudflare.
                fastcgi_param HTTP_X_FORWARDED_PROTO $$laravel_forwarded_proto;
                fastcgi_param HTTP_X_FORWARDED_HOST $$laravel_forwarded_host;

                # Activa HTTPS para PHP cuando el proxy informa
                # X-Forwarded-Proto: https.
                fastcgi_param HTTPS $$https_flag;

                fastcgi_read_timeout 300;
            }


            # ====================================================
            # BLOQUEO DE ARCHIVOS OCULTOS
            # ====================================================

            location ~ /\.(?!well-known).* {
                deny all;
            }
        }

        NGINX

        exec nginx -g 'daemon off;'

    depends_on:
      app:
        condition: service_healthy

    # Puerto utilizado en el despliegue probado por tu jefe.
    # No ocupa los puertos 80/443 del host porque esos pertenecen
    # a Nginx Proxy Manager / Cloudflare.
    ports:
      - "8010:80"

    volumes:
      - bitacora_storage:/var/www/storage:ro

    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://127.0.0.1/up > /dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    # internal:
    #   comunicación con Laravel.
    #
    # infra-net:
    #   comunicación con Nginx Proxy Manager.
    networks:
      - internal
      - infra-net

# ==============================================================
# REDES
# ==============================================================

networks:

  # Red privada de la aplicación.
  internal:
    driver: bridge

  # Red Docker que ya existe en producción y comparte
  # Nginx Proxy Manager.
  infra-net:
    external: true

# ==============================================================
# VOLÚMENES PERSISTENTES
# ==============================================================

volumes:

  # Base de datos MySQL.
  bitacora_mysql:

  # Storage de Laravel.
  bitacora_storage:
