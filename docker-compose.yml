services:
  app:
    image: cristian123456/bitacora-fnc:v1.5.19
    container_name: laravel_app_bitacora
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      BROADCAST_CONNECTION: log
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./Cafe/Apps/Bitacora-fnc/storage:/var/www/storage
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  scheduler:
    image: cristian123456/bitacora-fnc:v1.5.19
    container_name: scheduler_bitacora
    restart: unless-stopped
    working_dir: /var/www
    entrypoint: []
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    environment:
      BROADCAST_CONNECTION: log
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - ./Cafe/Apps/Bitacora-fnc/storage:/var/www/storage
    networks:
      - internal

  webserver:
    image: cristian123456/bitacora-fnc:v1.5.19
    container_name: nginx_bitacora
    restart: unless-stopped
    entrypoint: []
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./Cafe/Apps/Bitacora-fnc/storage:/var/www/storage:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1/up > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: mysql:8
    container_name: mysql_bitacora
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD debe estar definido en .env}
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - ./Cafe/Apps/Bitacora-fnc/mysql:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  internal:
    driver: bridge
