name: thriving_rally

# ==============================================================================
# docker-compose.yml — PRODUCCIÓN
# Sistema de Bitácoras / Jurídica
# Compatible con ZimaOS / CasaOS
#
# SOLUCIÓN NGINX: el config se monta como archivo desde el host.
# El archivo /DATA/AppData/bitacoras/nginx/default.conf debe existir
# en el servidor ANTES de levantar este compose.
# Ver instrucciones de despliegue en README o en la sección nginx.
# ==============================================================================

services:

  # ============================================================================
  # LARAVEL / PHP-FPM
  # ============================================================================
  juridica_app:
    image: cristian123456/bitacora-fnc:v1.5.16

    container_name: juridica_app

    restart: unless-stopped

    working_dir: /var/www

    environment:
      APP_NAME: "Sistema de Bitácoras"
      APP_ENV: "production"
      APP_KEY: "base64:e7FQIk4F+fKVYhxudjgdwtez8Jia2ywbS/VV51Yg73Q="
      APP_DEBUG: "false"
      APP_URL: "http://192.168.76.161:8010"

      APP_TIMEZONE: "America/Bogota"
      APP_LOCALE: "es"
      APP_FALLBACK_LOCALE: "en"

      ADMIN_EMAIL: "administrador@cafedecolombia.com"
      ADMIN_PASSWORD: "ChangeMeOnFirstLogin!"

      DB_CONNECTION: "mysql"
      DB_HOST: "juridica_db"
      DB_PORT: "3306"
      DB_DATABASE: "laravel"
      DB_USERNAME: "usuario"
      DB_PASSWORD: "BITACORA_FNC123"
      DB_ROOT_PASSWORD: "ROOT_bitacora_fnc123"

      SESSION_DRIVER: "file"
      SESSION_LIFETIME: "120"
      SESSION_ENCRYPT: "false"

      CACHE_STORE: "file"

      QUEUE_CONNECTION: "database"
      FILESYSTEM_DISK: "local"

      LOG_CHANNEL: "stack"
      LOG_STACK: "single"
      LOG_LEVEL: "warning"

    depends_on:
      juridica_db:
        condition: service_healthy

    networks:
      - juridica_net

    volumes:
      - /DATA/AppData/bitacoras/public:/var/www/public
      - /DATA/AppData/bitacoras/storage:/var/www/storage

    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ============================================================================
  # NGINX
  # El archivo default.conf se monta desde el host para evitar que
  # Docker Compose interpole las variables de nginx ($uri, $query_string, etc.)
  # ============================================================================
  juridica_nginx:
    image: nginx:alpine

    container_name: juridica_nginx

    restart: unless-stopped

    ports:
      - "8010:80"

    volumes:
      # Config de nginx montada directamente — sin interpolación
      - /DATA/AppData/bitacoras/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Archivos públicos de Laravel
      - /DATA/AppData/bitacoras/public:/var/www/public:ro
      - /DATA/AppData/bitacoras/storage:/var/www/storage:ro

    depends_on:
      juridica_app:
        condition: service_healthy

    networks:
      - juridica_net

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ============================================================================
  # MYSQL
  # ============================================================================
  juridica_db:
    image: mysql:8.0

    container_name: juridica_db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: "laravel"
      MYSQL_ROOT_PASSWORD: "ROOT_bitacora_fnc123"
      MYSQL_USER: "usuario"
      MYSQL_PASSWORD: "BITACORA_FNC123"

    ports:
      - "3310:3306"

    networks:
      - juridica_net

    volumes:
      - /DATA/AppData/bitacoras/mysql:/var/lib/mysql

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -pROOT_bitacora_fnc123 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

# ==============================================================================
# RED
# ==============================================================================
networks:
  juridica_net:
    name: juridica_net
    driver: bridge

# ==============================================================================
# CONFIGURACIÓN DE ZIMAOS / CASAOS
# Esto asegura que el icono funcione automáticamente al instalar
# ==============================================================================
x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: juridica_nginx
  title:
    custom: bitacoras_fnc
  index: /
  port_map: "8010"
  scheme: http
