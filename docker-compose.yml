
services:
  app:
    build: .
    container_name: laravel_app_bitacora
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - ADMIN_EMAIL=${ADMIN_EMAIL:-Admin@cafedecolombia.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123!-}
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: nginx_bitacora
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8
    container_name: mysql_bitacora
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: