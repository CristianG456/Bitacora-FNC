
services:
  app:
    image: cristian123456/bitacora-fnc:v1.5.13
    container_name: laravel_app_bitacora
    restart: unless-stopped
    working_dir: /var/www
    environment:
      - ADMIN_EMAIL=${ADMIN_EMAIL:-Admin@cafedecolombia.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123!-}
    depends_on:
      - db
    volumes:
      - public_data:/var/www/public
      - storage_data:/var/www/storage

  webserver:
    image: nginx:alpine
    container_name: nginx_bitacora
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - public_data:/var/www/public
      - storage_data:/var/www/storage
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8
    container_name: mysql_bitacora
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
  public_data:
  storage_data: